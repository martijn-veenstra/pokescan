name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run server tests
        run: npm ci && npm test
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests (navigation and the scanner fixture corpus)
        run: npm run test:e2e
      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Deploy with the Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_SERVICE || 'pokescan' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN secret. Create a project token in Railway (Project Settings > Tokens) and add it in GitHub under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm i -g @railway/cli
          railway up --service "$SERVICE" --ci
      - name: Smoke check the live health endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://pokescan-production.up.railway.app' }}
        run: |
          echo "Waiting for $APP_URL/api/health ..."
          for i in $(seq 1 20); do
            if out=$(curl -sf --max-time 10 "$APP_URL/api/health"); then
              echo "health: $out"
              echo "$out" | grep -q '"storage":"postgres"' || echo "::warning::storage is not postgres - is DATABASE_URL set on the service?"
              echo "$out" | grep -q '"sync":true' || echo "::warning::sync is off - is PASSCODE set on the service?"
              exit 0
            fi
            sleep 6
          done
          echo "::error::health endpoint did not answer within 2 minutes"
          exit 1
      - name: Report the live schedule sources (Leek Duck feeds and Team GO Rocket lineups)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://pokescan-production.up.railway.app' }}
        run: |
          # the first call after a deploy builds the cache (Leek Duck pages), so allow a slow answer and never fail the deploy on it
          if out=$(curl -sf --max-time 90 "$APP_URL/api/sources"); then
            echo "$out" | python3 scripts/report_sources.py | tee sources-report.txt
          else
            echo "::warning::/api/sources did not answer in time"
          fi
          # when the Rocket page could not be parsed, fetch it here and show its structure so the parser can be fixed from the log
          if grep -q "rocket lineups: 0" sources-report.txt 2>/dev/null; then
            curl -sL --max-time 30 -A "Mozilla/5.0 (PokeScan smoke check)" https://leekduck.com/rocket-lineups/ -o rocket-lineups.html || true
            python3 scripts/inspect_page.py rocket-lineups.html || true
          fi
      - name: Keep the Rocket page for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocket-lineups-page
          path: rocket-lineups.html
          if-no-files-found: ignore
          retention-days: 3
