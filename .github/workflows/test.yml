name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]   # main runs the same tests inside deploy-railway.yml, right before deploying

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokescan
          POSTGRES_PASSWORD: pokescan
          POSTGRES_DB: pokescan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pokescan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Server tests (in-memory store)
        run: npm test
      - name: Server tests (Postgres store)
        env:
          DATABASE_URL: postgres://pokescan:pokescan@localhost:5432/pokescan_test
        run: npm test
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (navigation and the scanner fixture corpus)
        run: npm run test:e2e
      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
