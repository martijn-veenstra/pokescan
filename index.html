.mon h3{font-size:16px;display:flex;justify-content:space-between}

.flag{font-size:12px;color:var(--warn)}
.fix{margin-top:8px;display:none;gap:6px;flex-wrap:wrap}
.mon.editing .fix{display:flex}
.fix input{width:76px;background:#0e1420;border:1px solid #2a3850;border-radius:8px;color:var(--ink);padding:6px;font-size:14px}
.fix button{background:var(--acc);border:none;border-radius:8px;padding:6px 12px;font-weight:700;color:#08251a}
#jsonPanel{display:none;background:var(--card);border:1px solid #2a3850;border-radius:14px;padding:12px;margin:10px 0}
#jsonPanel.open{display:block}
#jsonPanel .tools{display:flex;gap:8px;margin-bottom:10px}
#jsonPanel .tools button{flex:1;background:#0e1420;border:1px solid #2a3850;border-radius:8px;color:var(--ink);padding:8px;font-size:14px}
#jsonText{font:12px/1.5 ui-monospace,monospace;color:var(--ink);white-space:pre;overflow:auto;max-height:60vh;margin:0}
video,canvas{display:none}

<script>
/* ---------- data & solver ---------- */
const DATA = JSON.parse(document.getElementById('pogodata').textContent);
const SPECIES = Object.keys(DATA.stats);
const DUST = [200,400,600,800,1000,1300,1600,1900,2200,2500,3000,3500,4000,4500,5000,6000,7000,8000,9000,10000];
const dustLevel = c => { const i = DUST.indexOf(c); return i < 0 ? null : [i*2+1, i*2+2.5]; };
function cpmAt(l){ const i = Math.floor(l)-1;
  return l === Math.floor(l) ? DATA.cpm[i] : Math.sqrt((DATA.cpm[i]**2 + DATA.cpm[i+1]**2)/2); }
function calcCP(b,ia,id,is,m){ return Math.max(10, Math.floor((b[0]+ia)*Math.sqrt(b[1]+id)*Math.sqrt(b[2]+is)*m*m/10)); }
function calcHP(b,is,m){ return Math.max(10, Math.floor((b[2]+is)*m)); }
function solve(species, cp, hp, level, dust){
  const b = DATA.stats[species]; if(!b) return [];
  let levels;
  if(level) levels = [level];
  else if(dust && dustLevel(dust)){ const [lo,hi] = dustLevel(dust);
    levels = []; for(let l=lo*2; l<=hi*2; l++) levels.push(l/2); }
  else { levels = []; for(let l=2; l<=110; l++) levels.push(l/2); }
  const res = [];
  for(const lv of levels){ const m = cpmAt(lv);
    for(let is=0; is<16; is++){ if(calcHP(b,is,m) !== hp) continue;
      for(let ia=0; ia<16; ia++) for(let id=0; id<16; id++)
        if(calcCP(b,ia,id,is,m) === cp) res.push([lv,ia,id,is]); } }
  return res;
}

/* ---------- pixel helpers ---------- */
function gs(px,i){ return 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2]; }         // r,g,b order (getImageData)
function sat(px,i){ const mx=Math.max(px[i],px[i+1],px[i+2]), mn=Math.min(px[i],px[i+1],px[i+2]);
  return mx===0?0:255*(mx-mn)/mx; }

/* ---------- level from arc (RANSAC port of the validated Python) ---------- */
function detectLevel(px, W, H, trainer){
  const pts=[]; const y0=Math.floor(0.03*H), y1=Math.floor(0.34*H);
  for(let y=y0; y<y1; y+=2) for(let x=0; x<W; x+=2){ const i=(y*W+x)*4;
    if(gs(px,i)>110 && sat(px,i)<60) pts.push([x-W/2, y]); }
  if(pts.length<150) return null;
  let bi=0, bm=null;
  for(let t=0; t<800; t++){
    const p=pts[(Math.random()*pts.length)|0], q=pts[(Math.random()*pts.length)|0];
    const den=2*(p[1]-q[1]); if(Math.abs(den)<1e-6) continue;
    const cy=(p[0]**2+p[1]**2-q[0]**2-q[1]**2)/den;
    const r2=p[0]**2+(p[1]-cy)**2; if(r2<=0) continue;
    const r=Math.sqrt(r2);
    if(r<0.3*W||r>0.62*W||cy<0.1*H||cy>0.5*H) continue;
    let inl=0; for(const s of pts){ if(Math.abs(Math.hypot(s[0],s[1]-cy)-r)<5) inl++; }
    if(inl>bi){ bi=inl; bm=[cy,r]; }
  }
  if(!bm || bi<80) return null;
  // refit on inliers (least squares, cx fixed)
  let Sy=0,S1=0,Syy=0,Sb=0,Syb=0;
  for(const s of pts){ if(Math.abs(Math.hypot(s[0],s[1]-bm[0])-bm[1])>=5) continue;
    const b=s[0]**2+s[1]**2; Sy+=2*s[1]; S1+=1; Syy+=4*s[1]**2; Sb+=b; Syb+=2*s[1]*b; }
  const det=Syy*S1-Sy*Sy; if(Math.abs(det)<1e-6) return null;
  const cy=(Syb*S1-Sy*Sb)/det, k=(Syy*Sb-Sy*Syb)/det, r=Math.sqrt(k+cy*cy);
  // dot: bright colorless pixels within 12px of circle, angular histogram peak
  const hist=new Float32Array(360); const angs=[];
  for(let y=y0; y<Math.floor(0.4*H); y++) for(let x=0; x<W; x++){ const i=(y*W+x)*4;
    if(gs(px,i)>225 && sat(px,i)<50){
      const d=Math.abs(Math.hypot(x-W/2, y-cy)-r);
      if(d<12){ const a=Math.atan2(cy-y, x-W/2)*180/Math.PI;
        if(a>5&&a<175){ angs.push(a); hist[Math.floor(a*2)]++; } } } }
  if(angs.length<30) return null;
  let pk=0; for(let i=1;i<360;i++) if(hist[i]>hist[pk]) pk=i;
  const sel=angs.filter(a=>a>pk/2-2 && a<pk/2+2.5).sort((a,b)=>a-b);
  const ang=sel[Math.floor(sel.length/2)];
  const frac=(180-ang)/180;
  const mx=Math.min(trainer+10,50);
  const target=cpmAt(1)+frac*(cpmAt(mx)-cpmAt(1));
  let best=1, bd=1e9;
  for(let l=2;l<=mx*2;l++){ const d=Math.abs(cpmAt(l/2)-target); if(d<bd){bd=d;best=l/2;} }
  return best;
}

/* ---------- OCR ---------- */
let worker=null;
async function getWorker(){ if(!worker) worker=await Tesseract.createWorker('eng'); return worker; }

function binarize(ctx,W,H,x0,y0,w,h,scale,fn){    // returns canvas: black text on white
  const src=ctx.getImageData(x0,y0,w,h).data;
  const c2=document.getElementById('cv2'); c2.width=w*scale; c2.height=h*scale;
  const g=c2.getContext('2d');
  const im=g.createImageData(w,h);
  for(let i=0;i<w*h;i++){ const v = fn(src,i*4) ? 0 : 255;
    im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v; im.data[i*4+3]=255; }
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  tmp.getContext('2d').putImageData(im,0,0);
  g.imageSmoothingEnabled=true; g.drawImage(tmp,0,0,w*scale,h*scale);
  return c2;
}

async function scanFrame(ctx, W, H, trainer){
  const wk=await getWorker();
  const out={};
  // CP strip: white & colorless text on sky
  const cpc=binarize(ctx,W,H, Math.floor(0.12*W), Math.floor(0.03*H), Math.floor(0.76*W), Math.floor(0.11*H), 2,
    (p,i)=> gs(p,i)>190 && sat(p,i)<45);
  await wk.setParameters({tessedit_char_whitelist:'CPcp0123456789 ', tessedit_pageseg_mode:'7'});
  let t=(await wk.recognize(cpc)).data.text.replace(/\s/g,'');
  let m=t.match(/(\d{2,4})/); if(m) out.cp=parseInt(m[1]);
  // card region: dark text on white card
  await wk.setParameters({tessedit_char_whitelist:'', tessedit_pageseg_mode:'6'});
  const c2=document.getElementById('cv2');
  const ch=Math.floor(0.55*H); c2.width=Math.floor(W/2); c2.height=Math.floor(ch/2);
  c2.getContext('2d').drawImage(ctx.canvas, 0, Math.floor(0.28*H), W, ch, 0,0, c2.width, c2.height);
  t=(await wk.recognize(c2)).data.text;
  const flat=t.replace(/\n/g,' ');
  m=flat.match(/(\d+)\s*\/\s*(\d+)\s*HP/i); if(m) out.hp=parseInt(m[2]);
  for(const w2 of flat.toUpperCase().match(/[A-Z]{3,}/g)||[])
    if(DATA.stats[w2]){ out.species=w2; break; }
  for(const n of flat.match(/\b\d{1,2}[.,]\d{3}\b|\b\d{3,4}\b/g)||[]){
    const v=parseInt(n.replace(/[.,]/g,''));
    if(DUST.includes(v)){ out.dust=v; }                      // last match = power-up row
  }
  // level
  const px=ctx.getImageData(0,0,W,H).data;
  out.level=detectLevel(px,W,H,trainer);
  if(out.level && out.dust && dustLevel(out.dust)){          // dust window is authoritative
    const [lo,hi]=dustLevel(out.dust);
    if(out.level<lo||out.level>hi) out.level=Math.max(lo,Math.min(hi,out.level));
  }
  return out;
}

/* ---------- input handling ---------- */
const $=id=>document.getElementById(id);
const results=JSON.parse(localStorage.getItem('scans')||'[]');
render();

$('file').addEventListener('change', async e=>{
  const files=[...e.target.files]; e.target.value='';
  const trainer=parseInt($('trainer').value)||40;
  localStorage.setItem('trainer',$('trainer').value);
  $('prog').style.display='block';
  for(const f of files){
    if(f.type.startsWith('video')) await scanVideo(f,trainer);
    else await scanImage(f,trainer);
  }
  status('Done'); setTimeout(()=>$('prog').style.display='none',1500);
});
$('trainer').value=localStorage.getItem('trainer')||'40';

function status(s){ $('stat').textContent=s; }
function progress(p){ $('fill').style.width=(p*100).toFixed(1)+'%'; }

async function scanImage(file,trainer){
  status('Scanning '+file.name);
  const bmp=await createImageBitmap(file);
  const cv=$('cv'); cv.width=bmp.width; cv.height=bmp.height;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(bmp,0,0);
  await handleScan(ctx,bmp.width,bmp.height,trainer);
  progress(1);
}

async function scanVideo(file,trainer){
  const vid=$('vid'); vid.src=URL.createObjectURL(file);
  await new Promise(r=>vid.onloadedmetadata=r);
  const cv=$('cv'); cv.width=vid.videoWidth; cv.height=vid.videoHeight;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const step=1/3; let prevSig=null, lastKey='';
  for(let t=0; t<vid.duration; t+=step){
    vid.currentTime=t;
    await new Promise(r=>vid.onseeked=r);
    ctx.drawImage(vid,0,0);
    // cheap frame signature on 16x16 thumb to detect stability
    const th=document.createElement('canvas'); th.width=th.height=16;
    th.getContext('2d').drawImage(cv,0,0,16,16);
    const d=th.getContext('2d').getImageData(0,0,16,16).data;
    let sig=0; for(let i=0;i<d.length;i+=16) sig+=d[i];
    const stable = prevSig!==null && Math.abs(sig-prevSig)<sig*0.004;
    prevSig=sig;
    status(`Video ${Math.round(t)}s / ${Math.round(vid.duration)}s — ${results.length} scanned`);
    progress(t/vid.duration);
    if(!stable) continue;
    // status-screen check: top dark sky, lower half bright card
    const px=ctx.getImageData(0,0,cv.width,cv.height).data;
    let top=0,bot=0,n1=0,n2=0;
    for(let y=0;y<cv.height*0.1;y+=4) for(let x=0;x<cv.width;x+=8){ top+=gs(px,(Math.floor(y)*cv.width+x)*4); n1++; }
    for(let y=Math.floor(cv.height*0.6);y<cv.height*0.9;y+=4) for(let x=0;x<cv.width;x+=8){ bot+=gs(px,(y*cv.width+x)*4); n2++; }
    if(top/n1>120 || bot/n2<180) continue;
    const key=await handleScan(ctx,cv.width,cv.height,trainer,lastKey);
    if(key) lastKey=key;
  }
  URL.revokeObjectURL(vid.src);
}

async function handleScan(ctx,W,H,trainer,skipKey){
  const s=await scanFrame(ctx,W,H,trainer);
  if(!s.species && !s.cp) return null;
  const key=`${s.species}|${s.cp}|${s.hp}`;
  if(key===skipKey || results.some(r=>r.key===key)) return key;   // dedupe
  s.key=key;
  s.combos = (s.species && s.cp && s.hp) ? solve(s.species,s.cp,s.hp,s.level,s.dust) : [];
  results.unshift(s); save(); render();
  return key;
}

/* ---------- JSON view & export ---------- */
function exportData(){
  return results.map(r=>{
    const combos=r.combos||[], ps=combos.map(pct);
    return {
      species:r.species??null, cp:r.cp??null, hp:r.hp??null,
      level:r.level??null, dust:r.dust??null,
      ivPctMin:ps.length?+Math.min(...ps).toFixed(1):null,
      ivPctMax:ps.length?+Math.max(...ps).toFixed(1):null,
      combos:combos.map(c=>({level:c[0],atk:c[1],def:c[2],sta:c[3],pct:+pct(c).toFixed(1)}))
    };
  });
}
function toggleJSON(){
  const p=$('jsonPanel'), open=p.classList.toggle('open');
  $('jsonBtn').textContent=open?'Hide JSON':'View JSON';
  if(open) renderJSON();
}
function renderJSON(){
  if(!$('jsonPanel').classList.contains('open')) return;
  $('jsonText').textContent=JSON.stringify(exportData(),null,2);
}
async function copyJSON(btn){
  const txt=JSON.stringify(exportData(),null,2);
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  const old=btn.textContent; btn.textContent='Copied!'; setTimeout(()=>btn.textContent=old,1200);
}
function saveJSON(){
  const blob=new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pokescan-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* ---------- UI ---------- */
function save(){ localStorage.setItem('scans',JSON.stringify(results)); }
function clearAll(){ results.length=0; save(); render(); }
function pct(c){ return (c[1]+c[2]+c[3])/45*100; }
function render(){
  renderJSON();
  $('out').innerHTML=results.map((r,i)=>{
    const ps=r.combos.map(pct), lo=ps.length?Math.min(...ps):0, hi=ps.length?Math.max(...ps):0;
    const cls=hi>=90?'g':hi>=70?'m':'b';
    const flags=[!r.cp&&'CP?',!r.hp&&'HP?',!r.species&&'name?',!r.level&&'level?'].filter(Boolean).join(' ');
    return `<div class="mon ${cls}" id="m${i}">
      <h3><span>${r.species||'?'} ${r.cp?'CP '+r.cp:''}</span>
      <span class="pct">${ps.length? (lo===hi?hi.toFixed(1):lo.toFixed(1)+'–'+hi.toFixed(1))+'%':'—'}</span></h3>
      <div class="meta">HP ${r.hp??'?'} · L${r.level??'?'} · dust ${r.dust??'?'} ${flags?'<span class="flag">'+flags+'</span>':''}</div>
      <div class="ivs">${r.combos.slice(0,6).map(c=>`L${c[0]}  ${c[1]}/${c[2]}/${c[3]}  ${pct(c).toFixed(1)}%`).join('\n')||'no match — tap to correct'}</div>
      <div class="fix">
        <input placeholder="species" value="${r.species||''}" id="sp${i}">
        <input placeholder="CP" value="${r.cp||''}" id="cp${i}" inputmode="numeric">
        <input placeholder="HP" value="${r.hp||''}" id="hp${i}" inputmode="numeric">
        <input placeholder="level" value="${r.level||''}" id="lv${i}" inputmode="decimal">
        <button onclick="refix(${i});event.stopPropagation()">Re-solve</button>
      </div></div>`;
  }).join('');
  results.forEach((_,i)=>$('m'+i).addEventListener('click',()=>$('m'+i).classList.toggle('editing')));
}
function refix(i){
  const r=results[i];
  r.species=$('sp'+i).value.toUpperCase().trim()||r.species;
  r.cp=parseInt($('cp'+i).value)||r.cp;
  r.hp=parseInt($('hp'+i).value)||r.hp;
  r.level=parseFloat($('lv'+i).value)||r.level;
  r.key=`${r.species}|${r.cp}|${r.hp}`;
  r.combos=solve(r.species,r.cp,r.hp,r.level,r.dust);
  save(); render();
}
</script>
